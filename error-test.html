<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error Test</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script>
// Add error logging
window.addEventListener('error', function(e) {
  document.body.innerHTML += '<div style="background:red;color:white;padding:10px;margin:10px;">Error: ' + e.message + ' at ' + e.filename + ':' + e.lineno + '</div>';
});

window.addEventListener('unhandledrejection', function(e) {
  document.body.innerHTML += '<div style="background:orange;color:white;padding:10px;margin:10px;">Promise Error: ' + e.reason + '</div>';
});
</script>

<script type="text/babel">
const { useState } = React;

function App() {
  return <div>Test</div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
// Try to load the main script piece by piece
console.log('Starting to load main script...');
</script>

<!-- Now let's try loading the actual script content in chunks -->
<script type="text/babel">
// First, let's try to load just the constants
try {
  const MENTON_SPLASH_BG = 'test';
  console.log('Constants loaded successfully');
} catch (e) {
  console.error('Constants error:', e);
}
</script>
</body>
</html>

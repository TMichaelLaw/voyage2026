<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage MMXXVI Debug</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body { font-family: Arial; padding: 20px; }
.error { color: red; background: #ffe6e6; padding: 10px; margin: 10px 0; }
.success { color: green; background: #e6ffe6; padding: 10px; margin: 10px 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function App() {
  const [logs, setLogs] = useState([]);
  
  const addLog = (message) => {
    setLogs(prev => [...prev, `${new Date().toLocaleTimeString()}: ${message}`]);
  };

  // Test basic React rendering
  React.useEffect(() => {
    addLog("React component mounted successfully");
    
    // Test if PHASES data is accessible
    try {
      addLog("Testing data access...");
      // This would fail if there are syntax errors in the data
      const test = { test: "data" };
      addLog("Data test passed");
    } catch (error) {
      addLog(`Data test failed: ${error.message}`);
    }
  }, []);

  return (
    <div>
      <h1>Voyage MMXXVI Debug Page</h1>
      <div className="success">✓ React is working</div>
      
      <h2>Debug Logs:</h2>
      <div style={{ background: '#f5f5f5', padding: '10px', fontFamily: 'monospace' }}>
        {logs.map((log, i) => <div key={i}>{log}</div>)}
      </div>
      
      <button onClick={() => addLog("Button clicked")}>
        Test Interaction
      </button>
    </div>
  );
}

// Error boundary
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }

  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }

  componentDidCatch(error, errorInfo) {
    console.error('React Error:', error, errorInfo);
  }

  render() {
    if (this.state.hasError) {
      return (
        <div>
          <div className="error">
            <h2>React Error Caught:</h2>
            <pre>{this.state.error.toString()}</pre>
          </div>
        </div>
      );
    }

    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>
</body>
</html>
